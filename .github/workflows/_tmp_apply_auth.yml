name: 临时应用 auth.js 变更
on:
  push:
    paths:
      - 'scripts/_tmp_apply_auth.js'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 应用补丁
        run: node scripts/_tmp_apply_auth.js
      - name: 提交并清理
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q scripts/_tmp_apply_auth.js
          git rm -q .github/workflows/_tmp_apply_auth.yml
          git add auth.js
          git commit -m "feat: v1.0.3 商店封面改为图标底 + 局部加载圆圈"
          git push
